# The only compose file: same stack locally and on every deploy host.
#
#   cp .env.example .env        # fill APP_SECRET and BETTER_AUTH_SECRET
#   docker compose up -d db     # just Postgres, with `npm run dev` on the host
#   docker compose up --build   # whole stack, image built from source
#
# On a deploy host there is no source tree: the workflow copies this file next to
# an operator-managed .env and runs `docker compose pull && up -d --wait`, so the
# published image is used and nothing is built.
#
# TLS is not this stack's job. web publishes on 127.0.0.1 only; a reverse proxy
# installed on the host terminates HTTPS and forwards to it.
services:
  db:
    image: postgres:18-alpine
    container_name: validator-deck-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: canton
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: canton_dashboard
    ports:
      # Loopback only — for psql and backups, never from off-host.
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      # Postgres 18+ wants a single mount at /var/lib/postgresql, not .../data —
      # it stores data in a major-version subdirectory so pg_upgrade --link works.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canton -d canton_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    # Both keys on purpose: `up --build` builds this tag locally, `pull` fetches
    # the same name on a host that has no build context.
    image: ghcr.io/nodejumper-org/validator-deck-web:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: validator-deck-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Wins over the .env copy above, which points at the host-side port for
      # `npm run dev`. Deriving it here means the password is written once.
      DATABASE_URL: postgres://canton:${POSTGRES_PASSWORD}@db:5432/canton_dashboard
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      # First boot runs migrations before serving.
      start_period: 30s

volumes:
  db-data: {}
