# Local stack: builds the image from source. Everything runs in Docker.
#
#   cp .env.example .env      # fill APP_SECRET and BETTER_AUTH_SECRET
#   docker compose up --build
#
# For day-to-day development you usually want Postgres only, with Next running on
# the host for hot reload:
#
#   docker compose up -d db
#   npm run dev
#
# The two deploy stacks are docker-compose.dev.yml and docker-compose.prod.yml;
# they pull published images instead of building.
services:
  db:
    image: postgres:18-alpine
    container_name: validator-deck-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: canton
      POSTGRES_PASSWORD: canton
      POSTGRES_DB: canton_dashboard
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      # Postgres 18+ wants a single mount at /var/lib/postgresql, not .../data —
      # it stores data in a major-version subdirectory so pg_upgrade --link works.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canton -d canton_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: validator-deck-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://canton:canton@db:5432/canton_dashboard
      # Compose interpolates every service even when only `db` is started, so
      # these cannot be required variables. The app fails loudly if they are empty.
      APP_SECRET: ${APP_SECRET:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      PARTY_SCAN_CRON: ${PARTY_SCAN_CRON:-*/10 * * * *}
    ports:
      - "3000:3000"
    healthcheck:
      test:
        ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  db-data: {}
