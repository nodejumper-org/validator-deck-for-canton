<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The `::` of `hint::fingerprint`, set as four Plex-style square dots.
    Left colon carries the hint side (indigo), right one recedes like the
    fingerprint — the same hierarchy PartyId draws in the UI.
  -->
  <style>
    .h { fill: #4f46e5 }
    .f { fill: #5a6672 }
    @media (prefers-color-scheme: dark) {
      .h { fill: #818cf8 }
      .f { fill: #8a97a6 }
    }
  </style>
  <rect class="h" x="5.5" y="4.5" width="9" height="9" rx="2.5" />
  <rect class="h" x="5.5" y="18.5" width="9" height="9" rx="2.5" />
  <rect class="f" x="17.5" y="4.5" width="9" height="9" rx="2.5" />
  <rect class="f" x="17.5" y="18.5" width="9" height="9" rx="2.5" />
</svg>
