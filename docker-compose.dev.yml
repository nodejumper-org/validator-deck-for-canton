# Deploy stack for the dev environment (VPS).
#
# The deploy workflow scp's this file (renamed to docker-compose.yml) to
# ~/validator-deck/, then runs `docker compose pull && up -d --wait`. Runtime
# config lives in a persistent ./.env on the host (see .env.example); the
# workflow rewrites only the IMAGE_TAG line.
#
# No Caddy here: web publishes on 127.0.0.1 only and a reverse proxy already
# configured on the shared host terminates TLS and forwards to it. Use
# docker-compose.prod.yml when this stack should own 80/443 itself.
services:
  db:
    image: postgres:18-alpine
    container_name: validator-deck-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: canton
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: canton_dashboard
    ports:
      # Exposed on loopback only, for psql and backups from the host.
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canton -d canton_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: ghcr.io/vbloher/validator-deck-web:${IMAGE_TAG:-dev}
    container_name: validator-deck-web
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      # First boot runs migrations before serving.
      start_period: 30s

volumes:
  db-data: {}
