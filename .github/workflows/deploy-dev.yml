name: Deploy to dev

on:
  # Manual only, on purpose: a push to dev builds and tests in CI but never
  # touches the host. Run this from the Actions tab, picking the ref to deploy.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: dev
      image-tag: dev
    secrets: inherit
